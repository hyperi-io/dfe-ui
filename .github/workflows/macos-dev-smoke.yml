# Project:   dfe-ui
# File:      .github/workflows/macos-dev-smoke.yml
# Purpose:   Prove dfe-engine and the console run natively on a macOS arm64 runner
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Runs scripts/macos-dev-smoke.sh, the same file a developer runs on a Mac. The
# GitHub macOS runner has no docker, so the engine runs with no ClickHouse.
# Dispatch it with an engine ref and a ui ref to gate a release candidate.

name: macOS dev smoke

'on':
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macos-dev-smoke.yml'
      - 'scripts/macos-dev-smoke.sh'
      - 'apps/dfe-core-ui/smoke/**'
      - 'apps/dfe-core-ui/package.json'
      - 'apps/dfe-core-ui/next.config.ts'
      - 'apps/dfe-core-ui/src/proxy.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
  workflow_dispatch:
    inputs:
      engine-ref:
        type: string
        required: false
        default: 'main'
        description: 'dfe-engine tag, branch or sha to run the console against.'
      ui-ref:
        type: string
        required: false
        default: ''
        description: 'dfe-ui tag, branch or sha for the console. Empty takes the ref the run was dispatched on.'

permissions:
  contents: read

concurrency:
  group: macos-dev-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: macOS arm64 smoke
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out dfe-ui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dfe-ui
          ref: ${{ inputs.ui-ref || github.sha }}
          persist-credentials: false

      # A release tag predates the harness, so the script and spec come from the
      # ref this workflow runs on and the console under test from ui-ref.
      - name: Lay the harness over dfe-ui
        run: |
          mkdir -p dfe-ui/scripts dfe-ui/apps/dfe-core-ui/smoke
          cp harness/scripts/macos-dev-smoke.sh dfe-ui/scripts/
          cp harness/apps/dfe-core-ui/smoke/* dfe-ui/apps/dfe-core-ui/smoke/

      - name: Check out dfe-engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperi-io/dfe-engine
          path: dfe-engine
          ref: ${{ inputs.engine-ref || 'main' }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false

      - name: Run the smoke
        working-directory: dfe-ui
        env:
          CLICKHOUSE: none
        run: scripts/macos-dev-smoke.sh

      - name: Summary
        if: always()
        working-directory: dfe-ui
        run: |
          {
            echo '### macOS dev smoke'
            echo '```'
            head -n 40 .macos-smoke/smoke.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the log and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dev-smoke
          path: dfe-ui/.macos-smoke/
          if-no-files-found: warn
          retention-days: 7
