# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: typescript
quality:
  enabled: true
test:
  enabled: true
  coverage: true
build:
  enabled: true
  strategies:
    - native
release:
  enabled: true
  # dfe-ui is a private, deployed application ("private": true), not an npm
  # library -- opt out of the default npm publish (destinations.npm: npmjs)
  # so the release stage does not try to `npm publish` (which fails on the
  # missing NPM_TOKEN). Only the container ships.
  destinations:
    npm: false
  # Build + publish the container to ghcr.io/hyperi-io/dfe-ui. Explicit `true`
  # (not the default `auto`) so a missing/broken Dockerfile fails the build loudly
  # -- dfe-ui is a deployed service, the image must always ship.
  container:
    enabled: true
    dockerfile: Dockerfile
typescript:
  package_manager: auto
