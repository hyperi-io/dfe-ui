classification: product

language: typescript
quality:
  enabled: true
test:
  enabled: true
  coverage: true
build:
  enabled: true
  strategies:
    - native
release:
  enabled: true
  # A deployed app, not an npm library: only the container ships.
  destinations:
    npm: false
  # `true`, not `auto`, so a missing Dockerfile fails the build.
  container:
    enabled: true
    dockerfile: Dockerfile
  # The contract is committed because a TypeScript app has no binary to emit one.
  helm:
    enabled: true
    contract: deploy/contract.json
    library: '2.14.15'
