branches:
  - main
tagFormat: v${version}
plugins:
  - - '@semantic-release/commit-analyzer'
    - preset: conventionalcommits
      releaseRules:
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: sec
          release: patch
        - type: docs
          release: false
        - type: test
          release: false
        - type: refactor
          release: false
        - type: chore
          release: false
        - type: ci
          release: false
  - '@semantic-release/release-notes-generator'
  - - '@semantic-release/changelog'
    - changelogFile: CHANGELOG.md
  - - '@semantic-release/exec'
    - prepareCmd:
        python3 -c "from pathlib import Path; import json; Path('VERSION').write_text('${nextRelease.version}\n');
        p=Path('package.json'); d=json.loads(p.read_text()); d['version']='${nextRelease.version}';
        p.write_text(json.dumps(d, indent=2)+'\n')"
  - '@semantic-release/github'
