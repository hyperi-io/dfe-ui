nodeLinker: node-modules

# Install-time release-age gate, separate from Renovate's cooldown. CONTRIBUTING.md "What tends to bite" covers a CVE fix it blocks.
# yarn#6991 reports the `<n>d` suffix being dropped, so check the gate still fires after a yarn bump.
npmMinimalAgeGate: '7d'

# Peers these packages use through their own dependencies but do not declare;
# without them `yarn install` prints YN0086. Ranges follow the workspace.
packageExtensions:
  '@next/eslint-plugin-next@*':
    peerDependencies:
      eslint: ^9
  eslint-plugin-storybook@*:
    peerDependencies:
      typescript: ^5
  storybook@*:
    peerDependencies:
      react: ^19
