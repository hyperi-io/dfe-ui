nodeLinker: node-modules

# Supply-chain release-age gate, enforced at INSTALL time. Deliberate, and not
# a duplicate of the org Renovate cooldown: that one governs what Renovate
# proposes, this one governs what yarn will install, including a hand-run
# `yarn add` that Renovate never sees.
#
# The two do NOT share an exception. Renovate lets a CVE fix bypass its 7-day
# cooldown; this gate has no such notion, so a security PR raised early fails
# here with YN0016 "quarantined" until the version ages out (dfe-ui#129).
#
# Unblock a genuine CVE with the narrow escape, never by lowering the gate:
#   - npmPreapprovedPackages, using an EXACT locator (brace-expansion@5.0.8),
#     removed once the version ages past the window
#   - or `yarn add --no-time-gate` for a single command
#
# Keep the value in the `<n>d` form only while it demonstrably parses: yarn
# issue #6991 reports the suffix being dropped, which reads as protective and
# is not. Verified firing on yarn 4.13.0.
npmMinimalAgeGate: '7d'
